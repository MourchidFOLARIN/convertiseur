<script>
// ═══════════════════ UTILITAIRES ═══════════════════
const enc8 = s => Array.from(new TextEncoder().encode(s));
const dec8 = b => new TextDecoder().decode(new Uint8Array(b));

// Base N générique (BigInt)
function baseNEnc(n, chars) {
  return str => {
    const bytes = enc8(str);
    if (!bytes.length) return '';
    let num = 0n;
    for (const b of bytes) num = (num << 8n) | BigInt(b);
    if (num === 0n) return chars[0];
    const base = BigInt(n); let out = '';
    while (num > 0n) { out = chars[Number(num % base)] + out; num /= base; }
    return out;
  };
}
function baseNDec(n, chars) {
  return val => {
    const v = val.trim(); if (!v) return '';
    const base = BigInt(n); let num = 0n;
    for (const c of v) { const idx = chars.indexOf(c); if (idx === -1) throw new Error('Char invalide: ' + c); num = num * base + BigInt(idx); }
    let hex = num.toString(16); if (hex.length % 2) hex = '0' + hex;
    return dec8(hex.match(/.{2}/g).map(h => parseInt(h, 16)));
  };
}

// Base32
const B32C = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function base32Enc(bytes) {
  let bits=0,val=0,out='';
  for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32C[(val>>>(bits-5))&31];bits-=5;}}
  if(bits>0)out+=B32C[(val<<(5-bits))&31];
  while(out.length%8)out+='='; return out;
}
function base32Dec(str) {
  const clean=str.toUpperCase().replace(/=+$/,'');
  let bits=0,val=0; const out=[];
  for(const c of clean){const idx=B32C.indexOf(c);if(idx===-1)throw new Error();val=(val<<5)|idx;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8;}}
  return out;
}

// Ascii85
function ascii85Enc(str) {
  const bytes = enc8(str); let out = '<~';
  for(let i=0;i<bytes.length;i+=4){
    const c=[bytes[i]||0,bytes[i+1]||0,bytes[i+2]||0,bytes[i+3]||0];
    let n=((c[0]<<24)|(c[1]<<16)|(c[2]<<8)|c[3])>>>0;
    const real=Math.min(4,bytes.length-i);
    if(n===0&&real===4){out+='z';continue;}
    const ch=[]; for(let j=0;j<5;j++){ch.unshift(String.fromCharCode((n%85)+33));n=Math.floor(n/85);}
    out+=ch.slice(0,real+1).join('');
  }
  return out+'~>';
}
function ascii85Dec(val) {
  const clean=val.trim().replace(/^<~/,'').replace(/~>$/,'').replace(/\s/g,'');
  const bytes=[]; let i=0;
  while(i<clean.length){
    if(clean[i]==='z'){bytes.push(0,0,0,0);i++;continue;}
    const chunk=clean.slice(i,i+5); let n=0;
    for(const ch of chunk) n=n*85+(ch.charCodeAt(0)-33);
    const pad=5-chunk.length;
    for(let p=0;p<pad;p++) n=n*85+84;
    const quad=[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
    bytes.push(...quad.slice(0,chunk.length-1)); i+=5;
  }
  return dec8(bytes);
}

// Base91
const B91='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!#$%&()*+,./:;<=>?@[]^_`{|}~"';
function base91Enc(bytes){let b=0,n=0,o='';for(const byte of bytes){b|=byte<<n;n+=8;if(n>13){let v=b&8191;if(v>88){b>>=13;n-=13;}else{v=b&16383;b>>=14;n-=14;}o+=B91[v%91]+B91[Math.floor(v/91)];}}if(n){o+=B91[b%91];if(n>7||b>90)o+=B91[Math.floor(b/91)];}return o;}
function base91Dec(str){let v=-1,b=0,n=0;const out=[];for(const c of str){const p=B91.indexOf(c);if(p===-1)continue;if(v<0){v=p;}else{v+=p*91;b|=v<<n;n+=(v&8191)>88?13:14;v=-1;do{out.push(b&255);b>>=8;n-=8;}while(n>7);}}if(v>-1)out.push((b|v<<n)&255);return dec8(out);}

// UUencode
function uuEnc(str){const bytes=enc8(str);let out='';for(let i=0;i<bytes.length;i+=45){const line=bytes.slice(i,i+45);out+=String.fromCharCode(line.length+32);for(let j=0;j<line.length;j+=3){const a=line[j]||0,b=line[j+1]||0,c=line[j+2]||0;out+=[(a>>2)&63,((a&3)<<4|(b>>4))&63,((b&15)<<2|(c>>6))&63,c&63].map(v=>String.fromCharCode(v?v+32:96)).join('');}out+='\n';}return out.trim();}
function uuDec(val){const lines=val.trim().split('\n');const bytes=[];for(const line of lines){if(!line.trim())continue;const len=line.charCodeAt(0)-32;if(len<=0)continue;const lb=[];for(let i=1;i+3<line.length;i+=4){const a=(line.charCodeAt(i)-32)&63,b=(line.charCodeAt(i+1)-32)&63,c=(line.charCodeAt(i+2)-32)&63,d=(line.charCodeAt(i+3)-32)&63;lb.push(((a<<2)|(b>>4))&255,((b<<4)|(c>>2))&255,((c<<6)|d)&255);}bytes.push(...lb.slice(0,len));}return dec8(bytes);}

// Quoted-Printable
function qpEnc(str){return enc8(str).map(b=>(b===61||(b<32&&b!==9&&b!==10&&b!==13)||b>126)?'='+b.toString(16).toUpperCase().padStart(2,'0'):String.fromCharCode(b)).join('');}
function qpDec(val){const s=val.replace(/=\r?\n/g,'');const bytes=[];for(let i=0;i<s.length;){const h=s.substr(i+1,2);if(s[i]==='='&&/^[0-9A-Fa-f]{2}$/.test(h)){bytes.push(parseInt(h,16));i+=3;}else{const ch=String.fromCodePoint(s.codePointAt(i));bytes.push(...enc8(ch));i+=ch.length;}}return dec8(bytes);}

// ROT / César
const rot=(str,n)=>str.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97;return String.fromCharCode(((c.charCodeAt(0)-b+n+52)%26)+b);});
const rot5=str=>str.replace(/[0-9]/g,c=>String.fromCharCode(((c.charCodeAt(0)-48+5)%10)+48));
const rot47=str=>str.replace(/[!-~]/g,c=>String.fromCharCode(33+((c.charCodeAt(0)-33+47)%94)));
const atbash=str=>str.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97;return String.fromCharCode(b+25-(c.charCodeAt(0)-b));});

function vigenereEnc(str,key){key=key.toUpperCase();let ki=0;return str.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97,k=key.charCodeAt(ki++%key.length)-65;return String.fromCharCode(((c.charCodeAt(0)-b+k+26)%26)+b);});}
function vigenereDec(str,key){key=key.toUpperCase();let ki=0;return str.replace(/[a-zA-Z]/g,c=>{const b=c<='Z'?65:97,k=key.charCodeAt(ki++%key.length)-65;return String.fromCharCode(((c.charCodeAt(0)-b-k+26)%26)+b);});}

const PGRID='ABCDEFGHIKLMNOPQRSTUVWXYZ';
const stripAcc=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function polyEnc(str){return stripAcc(str.toUpperCase()).replace(/J/g,'I').replace(/[A-Z]/g,c=>{const i=PGRID.indexOf(c);return i<0?c:(Math.floor(i/5)+1)+''+(i%5+1);});}
function polyDec(str){let c=str;if(/^\s*[1-5]{2}(\s+[1-5]{2})+\s*$/.test(c))c=c.replace(/\s+/g,'');let o='';for(let i=0;i<c.length;){if(/[1-5]/.test(c[i])&&/[1-5]/.test(c[i+1]||'')){o+=PGRID[(+c[i]-1)*5+(+c[i+1]-1)];i+=2;}else{o+=c[i];i++;}}return o;}

function railEnc(str,r=3){const rows=Array.from({length:r},()=>[]);let row=0,dir=1;for(const c of str){rows[row].push(c);if(row===0)dir=1;if(row===r-1)dir=-1;row+=dir;}return rows.map(r=>r.join('')).join('');}
function railDec(str,r=3){const chars=Array.from(str),n=chars.length,pat=[];let row=0,dir=1;for(let i=0;i<n;i++){pat.push(row);if(row===0)dir=1;if(row===r-1)dir=-1;row+=dir;}const cnt=Array(r).fill(0);pat.forEach(r=>cnt[r]++);const rows=[];let pos=0;for(let i=0;i<r;i++){rows.push(chars.slice(pos,pos+cnt[i]));pos+=cnt[i];}const idx=Array(r).fill(0);let out='';for(const r of pat)out+=rows[r][idx[r]++];return out;}
const vigKey=k=>{k=String(k||'').replace(/[^a-zA-Z]/g,'');if(!k)throw new Error('clé vide');return k;};
const railN=r=>{const n=parseInt(r,10);if(!(n>=2))throw new Error('rails < 2');return Math.min(n,100);};

// Bacon (26 lettres) : lettres groupées par 5, mots séparés par " / ", accents retirés
function baconEnc(str){return stripAcc(str.toUpperCase()).split(/\s+/).map(w=>(w.match(/[A-Z]/g)||[]).map(c=>(c.charCodeAt(0)-65).toString(2).padStart(5,'0').replace(/0/g,'A').replace(/1/g,'B')).join(' ')).filter(Boolean).join(' / ');}
function baconDec(str){if(/[C-Zc-z]/.test(str))throw new Error('Bacon: A/B uniquement');const words=str.split('/').map(w=>w.replace(/[^ABab]/g,'').toUpperCase()).filter(Boolean);if(!words.length)throw new Error();return words.map(w=>{if(w.length%5)throw new Error('groupes de 5');return w.match(/.{5}/g).map(g=>{const n=parseInt(g.replace(/A/g,'0').replace(/B/g,'1'),2);return n<26?String.fromCharCode(n+65):'?';}).join('');}).join(' ');}

function crc32(str){const bytes=enc8(str);let crc=0xFFFFFFFF;for(const b of bytes){let n=(crc^b)&0xFF;for(let i=0;i<8;i++)n=n&1?(n>>>1)^0xEDB88320:(n>>>1);crc=(crc>>>8)^n;}return((crc^0xFFFFFFFF)>>>0).toString(16).padStart(8,'0');}

// MD5 (implémentation pure JS, RFC 1321) sur les octets UTF-8
const MD5_S=[7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
const MD5_K=Array.from({length:64},(_,i)=>Math.floor(Math.abs(Math.sin(i+1))*4294967296)>>>0);
function md5(str){
  const bytes=enc8(str),bitLen=bytes.length*8;
  bytes.push(0x80);while(bytes.length%64!==56)bytes.push(0);
  const lo=bitLen>>>0,hi=Math.floor(bitLen/4294967296)>>>0;
  for(let i=0;i<4;i++)bytes.push((lo>>>(8*i))&255);
  for(let i=0;i<4;i++)bytes.push((hi>>>(8*i))&255);
  let a0=0x67452301,b0=0xefcdab89|0,c0=0x98badcfe|0,d0=0x10325476;
  for(let o=0;o<bytes.length;o+=64){
    const M=[];for(let i=0;i<16;i++){const p=o+i*4;M[i]=bytes[p]|(bytes[p+1]<<8)|(bytes[p+2]<<16)|(bytes[p+3]<<24);}
    let A=a0,B=b0,C=c0,D=d0;
    for(let i=0;i<64;i++){
      let F,g;
      if(i<16){F=(B&C)|(~B&D);g=i;}else if(i<32){F=(D&B)|(~D&C);g=(5*i+1)%16;}else if(i<48){F=B^C^D;g=(3*i+5)%16;}else{F=C^(B|~D);g=(7*i)%16;}
      F=(F+A+MD5_K[i]+M[g])|0;A=D;D=C;C=B;B=(B+((F<<MD5_S[i])|(F>>>(32-MD5_S[i]))))|0;
    }
    a0=(a0+A)|0;b0=(b0+B)|0;c0=(c0+C)|0;d0=(d0+D)|0;
  }
  return [a0,b0,c0,d0].map(v=>{let h='';for(let i=0;i<4;i++)h+=((v>>>(8*i))&255).toString(16).padStart(2,'0');return h;}).join('');
}

function unicodeUDec(v){return(v.match(/U\+([0-9A-Fa-f]{4,6})/g)||[]).map(u=>String.fromCodePoint(parseInt(u.slice(2),16))).join('');}

// Mécanisme « la dernière requête gagne » : chaque mise à jour reçoit un numéro de génération.
// Les résultats synchrones sont écrits immédiatement ; les résultats async (hashes) ne sont
// appliqués que si aucune saisie plus récente n'a eu lieu entre-temps.
let updateGen = 0;
let lastOrigin = 'text';
function getParam(id){
  const e = ENC_BY_ID[id];
  if(!e || !e.param) return undefined;
  const el = document.getElementById('param_'+id);
  return el ? el.value : e.param.def;
}
function setCount(id){
  const c = document.getElementById('cnt_'+id);
  if(c) c.textContent = Array.from(fields[id].value).length + ' car.';
}
function setField(e, v){
  fields[e.id].value = v;
  fields[e.id].classList.remove('error');
  document.getElementById('err_'+e.id).style.display='none';
  setCount(e.id);
}
async function updateAll(originId) {
  const myGen = ++updateGen;
  lastOrigin = originId;
  const enc = ENC_BY_ID[originId];
  const ta = fields[originId];
  const val = ta.value;
  const errEl = document.getElementById('err_'+originId);
  setCount(originId);

  if(!val.trim()){
    ENCODINGS.forEach(e=>{ if(e.id!==originId) fields[e.id].value=''; fields[e.id].classList.remove('error'); document.getElementById('err_'+e.id).style.display='none'; setCount(e.id); });
    return;
  }

  let text;
  try {
    text = enc.decode(val, getParam(originId));
    if(typeof text !== 'string') throw 0;
  } catch {
    ta.classList.add('error');
    errEl.style.display = 'inline';
    return;
  }
  ta.classList.remove('error');
  errEl.style.display = 'none';

  const pending = [];
  for(const e of ENCODINGS){
    if(e.id===originId) continue;
    let r;
    try { r = e.encode(text, getParam(e.id)); } catch { r = e.readonly?'∅':'⚠'; }
    if(r && typeof r.then === 'function') pending.push(r.then(v=>[e,v], ()=>[e,'∅']));
    else setField(e, r);
  }
  if(!pending.length) return;
  const results = await Promise.all(pending);
  if(myGen !== updateGen) return; // une saisie plus récente a pris le relais : on jette ces résultats
  results.forEach(([e,v])=>setField(e,v));
}

ENCODINGS.forEach(e => {
  if(!e.readonly) fields[e.id].addEventListener('input', ()=>updateAll(e.id));
  if(e.param){
    document.getElementById('param_'+e.id).addEventListener('input', ()=>{
      // Si la carte paramétrée est la source, on re-déchiffre ; sinon on ré-encode depuis le texte
      if(lastOrigin===e.id && fields[e.id].value.trim()) updateAll(e.id);
      else if(fields.text.value) updateAll('text');
    });
  }
});

function clearAll(reset=true){
  updateGen++; // annule tout calcul async en cours
  ENCODINGS.forEach(e=>{
    if(reset) fields[e.id].value='';
    fields[e.id].classList.remove('error');
    document.getElementById('err_'+e.id).style.display='none';
    setCount(e.id);
  });
}

function applyFilter(){
  grid.querySelectorAll('.card').forEach(c=>{
    const catOk = activeFilter==='all' || c.dataset.cat===activeFilter;
    const srchOk = !searchTerm || c.dataset.label.includes(searchTerm);
    c.style.display = (catOk&&srchOk)?'':'none';
  });
}

catFilters.addEventListener('click', e=>{
  const btn = e.target.closest('.catbtn');
  if(!btn) return;
  setFilter(btn.dataset.cat);
});
function setFilter(cat){
  if(!CATS[cat]) cat = 'all';
  activeFilter = cat;
  catFilters.querySelectorAll('.catbtn').forEach(b=>{
    b.classList.toggle('active', b.dataset.cat===activeFilter);
    b.style.background = b.dataset.cat===activeFilter?'#1e293b':'transparent';
  });
  applyFilter();
  try{ localStorage.setItem('conv_filter', cat); }catch{}
}

document.getElementById('searchBox').addEventListener('input', e=>{
  searchTerm = e.target.value.toLowerCase().trim();
  applyFilter();
});

// Copy / Clear Handlers
document.addEventListener('click', e=>{
  const copyId = e.target.closest('[data-copy]')?.dataset.copy;
  const clearId = e.target.closest('[data-clear]')?.dataset.clear;
  if(copyId && fields[copyId]){
    navigator.clipboard.writeText(fields[copyId].value).catch(()=>{fields[copyId].select();document.execCommand('copy');});
    const btn = e.target.closest('[data-copy]');
    btn.classList.add('copied'); btn.textContent='✓ Copié!';
    setTimeout(()=>{btn.classList.remove('copied');btn.textContent='⧉ Copier';},1200);
  }
  if(clearId && fields[clearId]){ fields[clearId].value=''; updateAll(clearId); }
});

document.getElementById('clearAllBtn').addEventListener('click',()=> {
  clearAll(true);
  document.getElementById('magicInput').value = '';
  resetMagic();
});

function setTheme(light){
  document.body.classList.toggle('light', light);
  document.getElementById('themeToggle').textContent = light?'🌙 Sombre':'☀ Thème';
  try{ localStorage.setItem('conv_theme', light?'light':'dark'); }catch{}
}
document.getElementById('themeToggle').addEventListener('click',()=> setTheme(!document.body.classList.contains('light')));

// Restauration des préférences (thème + filtre)
(()=>{
  let theme=null, filter=null;
  try{ theme=localStorage.getItem('conv_theme'); filter=localStorage.getItem('conv_filter'); }catch{}
  if(theme==='light') setTheme(true);
  if(filter && CATS[filter] && filter!=='all') setFilter(filter);
})();


// ═══════════════════ ANALYSEUR INTELLIGENT COMPLET & RECURSIF ═══════════════════
const magicInput = document.getElementById('magicInput');
const magicOutput = document.getElementById('magicOutput');
const magicZone = document.getElementById('magicZone');
const magicCount = document.getElementById('magicCount');
const MAGIC_IDLE = '<span style="color:#4b5563; font-style:italic;">En attente d\'une chaîne suspecte...</span>';
let magicResult = '';

function resetMagic(){
  magicOutput.innerHTML = MAGIC_IDLE;
  magicZone.classList.remove('magic-success');
  magicCount.textContent = '0 car.';
  magicResult = '';
}

// --- Outils de scoring ---
const decStrict = b => new TextDecoder('utf-8', {fatal:true}).decode(new Uint8Array(b));
// Texte imprimable (tout Unicode) : refuse caractères de contrôle, U+FFFD, surrogates isolés, zones privées / non assignées
const isReadable = str => typeof str === 'string' && str.trim().length > 0 &&
  !/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\uFFFD]|[\p{Cs}\p{Co}\p{Cn}]/u.test(str);
const textRatio = s => { const a = Array.from(s); if(!a.length) return 0; return a.filter(c=>/[\p{L}\p{N}\s.,;:!?'"()\[\]{}_@#&*+=\/-]/u.test(c)).length / a.length; };
const letterRatio = s => { const a = Array.from(s); if(!a.length) return 0; return a.filter(c=>/[\p{L}\s]/u.test(c)).length / a.length; };
const COMMON = new Set(('the be to of and a in that have i it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us is are was were has had been am hello world flag secret password key message quick brown fox jumps lazy dog test welcome try again here find found answer hidden code '+
  'le la les un une des du de et est en que qui dans pour pas sur au aux avec il elle ils nous vous je tu ce cette son sa ses mais ou donc ni car bonjour monde merci oui non très plus tout bien fait être avoir mot passe clé drapeau voici bravo salut').split(' '));
const wordScore = s => { const w = s.toLowerCase().match(/\p{L}+/gu) || []; if(!w.length) return 0; return w.filter(x=>COMMON.has(x)).length / w.length; };
const KNOWN_FLAG = /\b(?:flag|ctf|thm|picoctf|htb|ductf|csaw|hackthebox|rm|dghack|root-me)\{[^{}\n]{1,200}\}/i;
const ANY_FLAG = /\b[A-Za-z][A-Za-z0-9_-]{1,19}\{[^{}\n]{1,200}\}/g;
const hasAnyFlag = s => { ANY_FLAG.lastIndex = 0; return ANY_FLAG.test(s); };
const magicScore = s => wordScore(s)*2 + letterRatio(s) + (KNOWN_FLAG.test(s)?3:0) + (hasAnyFlag(s)?0.5:0);
// Pour les chiffrements par substitution (toujours « lisibles ») : n'accepter que si le texte s'améliore nettement
const commonLetters = s => (s.toLowerCase().match(/\p{L}+/gu) || []).filter(x=>COMMON.has(x)).join('').length;
const improvesText = (out, cur) => (KNOWN_FLAG.test(out) && !KNOWN_FLAG.test(cur)) ||
  (wordScore(out) >= 0.4 && wordScore(out) - wordScore(cur) >= 0.25 && commonLetters(out) >= 5);
const strongText = s => textRatio(s) >= 0.85 && letterRatio(s) >= 0.5;
// Garde-fou pour les bases « génériques » (alphabets larges) : il faut des mots connus, un flag,
// ou au moins 6 caractères latins imprimables très majoritairement alphabétiques
const genericOk = s => hasAnyFlag(s) || (wordScore(s) > 0 && textRatio(s) >= 0.9) ||
  (Array.from(s).length >= 6 && /^[\x20-\x7E\u00A0-\u00FF\r\n\t]+$/.test(s) && letterRatio(s) >= 0.85);

function bigBaseBytes(str, alphabet){
  const base = BigInt(alphabet.length); let num = 0n;
  for(const c of str){ const i = alphabet.indexOf(c); if(i<0) return null; num = num*base + BigInt(i); }
  let lead = 0; for(const c of str){ if(c===alphabet[0]) lead++; else break; }
  const out = []; while(num > 0n){ out.unshift(Number(num & 255n)); num >>= 8n; }
  return Array(lead).fill(0).concat(out);
}
function morseLoose(s){
  const words = s.trim().replace(/_/g,'-').split(/\s*[\/|]\s*|\s{3,}/).filter(Boolean);
  return words.map(w=>w.trim().split(/\s+/).map(x=>{ if(!(x in MO_R)) throw new Error('morse'); return MO_R[x]; }).join('')).join(' ');
}
const numTokens = s => s.trim().split(/[\s,;]+/).filter(Boolean);

// --- Détecteurs, groupés par niveau : du plus spécifique au plus générique ---
// Dans un niveau, tous les candidats valides sont comparés et le mieux noté l'emporte.
const TIERS = [
  [ // 1. Marqueurs explicites
    s => /^\s*<~[\s\S]*~>\s*$/.test(s) ? {name:'Ascii85', out:ascii85Dec(s)} : null,
    s => /\\u\{?[0-9a-fA-F]{2,6}\}?|\\x[0-9a-fA-F]{2}|U\+[0-9A-Fa-f]{4,6}/.test(s) ? {name:'Échappements Unicode (\\uXXXX / \\xNN / U+)', out:
      (()=>{ let t = s.replace(/\\u\{([0-9a-fA-F]{1,6})\}/g,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/\\u([0-9a-fA-F]{4})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
             if(/U\+[0-9A-Fa-f]{4,6}/.test(t)) t = t.replace(/U\+([0-9A-Fa-f]{4,6})\s?/g,(_,h)=>String.fromCodePoint(parseInt(h,16)));
             if(/\\x[0-9a-fA-F]{2}/.test(t)) { const b=[]; for(let i=0;i<t.length;){ const m=/^\\x([0-9a-fA-F]{2})/.exec(t.slice(i,i+4)); if(m){b.push(parseInt(m[1],16));i+=4;} else { const ch=String.fromCodePoint(t.codePointAt(i)); b.push(...enc8(ch)); i+=ch.length; } } t = decStrict(b); }
             return t; })()} : null,
    s => /&(#\d{1,7}|#x[0-9a-fA-F]{1,6}|[a-zA-Z][a-zA-Z0-9]{1,31});/.test(s) ? {name:'Entités HTML', out:htmlEntDec(s)} : null,
    s => /%[0-9a-fA-F]{2}/.test(s) ? {name:'URL Percent Encoding', out:decodeURIComponent(/%20/.test(s)?s:s.replace(/\+/g,' '))} : null,
    s => { const m = s.match(/=[0-9A-F]{2}/g); if(!m || /^[A-Za-z0-9+\/]+={1,2}$/.test(s.trim())) return null;
      // en QP, seuls '=' , les blancs/fin de ligne et les octets non ASCII sont encodés
      if(!m.every(x=>{ const v = parseInt(x.slice(1),16); return v>=0x80 || [0x3D,0x09,0x0A,0x0D,0x20].includes(v); })) return null;
      return {name:'Quoted-Printable', out:qpDec(s)}; },
  ],
  [ // 2. Alphabets très restreints
    s => { if(!/^[01\s,]+$/.test(s)) return null; const toks = s.trim().split(/[\s,]+/);
      let bytes;
      if(toks.length>1 && toks.every(t=>t.length===7)) bytes = toks.map(t=>parseInt(t,2));
      else { const c = s.replace(/[\s,]/g,''); if(c.length<8 || c.length%8) return null; bytes = c.match(/.{8}/g).map(b=>parseInt(b,2)); }
      return {name:'Binaire', out:decStrict(bytes)}; },
    s => /^[.\-_\/|\s]+$/.test(s) && /[.\-]/.test(s) ? {name:'Code Morse', out:morseLoose(s)} : null,
    s => { if(!/^[ABab\s\/]+$/.test(s)) return null; const c = s.replace(/[\s\/]/g,''); if(c.length<10 || c.length%5) return null;
      const out = baconDec(s); return out.includes('?') ? null : {name:'Chiffre de Bacon', out}; },
  ],
  [ // 3. Formats numériques (décimal / octal / hex / A1Z26) — départagés par score
    s => { if(!/^\s*\d{1,7}([\s,;]+\d{1,7})+\s*$/.test(s)) return null; const n = numTokens(s).map(Number);
      if(n.every(x=>x<=255)) { try { return {name:'Décimal ASCII', out:decStrict(n)}; } catch {} }
      if(n.every(x=>x<=0x10FFFF)) { const out = String.fromCodePoint(...n); return genericOk(out) ? {name:'Codes caractères (décimal)', out} : null; } return null; },
    s => { if(!/^\s*[0-7]{2,3}([\s,;]+[0-7]{2,3})+\s*$/.test(s)) return null; const n = numTokens(s).map(t=>parseInt(t,8));
      if(n.some(x=>x>255)) return null; return {name:'Octal', out:decStrict(n)}; },
    s => { if(!/^[0-9a-fA-Fx\\\s:,;-]+$/.test(s)) return null; const c = s.replace(/0x|\\x|[\s:,;-]/gi,'');
      if(!/^[0-9a-fA-F]+$/.test(c) || c.length<4 || c.length%2) return null;
      const out = decStrict(c.match(/.{2}/g).map(h=>parseInt(h,16)));
      return textRatio(out) >= 0.7 ? {name:'Hexadécimal (Base16)', out} : null; },
    s => { if(!/^\s*\d{1,2}([\s,\-\/]+\d{1,2})+\s*$/.test(s)) return null;
      const words = s.trim().split(/\s*\/\s*|\s{2,}/).map(w=>w.split(/[\s,\-]+/).filter(Boolean));
      const toks = words.flat(); if(toks.length<3 || !toks.every(t=>+t>=1 && +t<=26)) return null;
      return {name:'A1Z26 (A=1…Z=26)', out:words.map(w=>w.map(t=>String.fromCharCode(64+ +t)).join('')).join(' ')}; },
  ],
  [ // 4. Base32 / Base64
    s => { const c = s.replace(/\s/g,''); if(!/^[A-Z2-7]+=*$/.test(c) && !/^[a-z2-7]+=*$/.test(c)) return null;
      if(c.length<8 || (c.includes('=') && c.length%8)) return null;
      const out = decStrict(base32Dec(c)); return (strongText(out) && genericOk(out)) || hasAnyFlag(out) ? {name:'Base32', out} : null; },
    s => { let c = s.replace(/\s/g,''); if(!/^[A-Za-z0-9+\/\-_]+={0,2}$/.test(c) || c.length<4) return null;
      const url = /[-_]/.test(c); if(url && /[+\/]/.test(c)) return null;
      c = c.replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,''); if(c.length%4===1) return null;
      while(c.length%4) c += '=';
      const out = decStrict(Array.from(atob(c), ch=>ch.charCodeAt(0)));
      return textRatio(out) >= 0.8 ? {name: url?'Base64 URL-safe':'Base64', out} : null; },
  ],
  [ // 5. Bases génériques : uniquement si l'aller-retour est exact et le résultat très « texte »
    s => { const c = s.trim(); if(c.length<4 || !/^[1-9A-HJ-NP-Za-km-z]+$/.test(c)) return null;
      const b = bigBaseBytes(c, B58); if(!b) return null; const out = decStrict(b);
      return (genericOk(out) && baseNEnc(58,B58)(out)===c) ? {name:'Base58', out} : null; },
    s => { const c = s.trim(); if(c.length<5 || !/^[!-u]+$/.test(c)) return null; const out = ascii85Dec(c);
      return (genericOk(out) && ascii85Enc(out)==='<~'+c+'~>') ? {name:'Ascii85 (sans délimiteurs)', out} : null; },
    s => { const c = s.trim(); if(c.length<5) return null; const b = bigBaseBytes(c, B85); if(!b) return null; const out = decStrict(b);
      return (genericOk(out) && baseNEnc(85,B85)(out)===c) ? {name:'Base85 (RFC 1924)', out} : null; },
    s => { const c = s.trim(); if(c.length<6 || [...c].some(ch=>!B91.includes(ch))) return null;
      const out = base91Dec(c); return (genericOk(out) && base91Enc(enc8(out))===c) ? {name:'Base91', out} : null; },
  ],
  [ // 6. Chiffrements par substitution : seulement si le résultat ressemble nettement plus à du texte
    s => { const out = rot(s,13); return improvesText(out,s) ? {name:'ROT13', out} : null; },
    s => { const out = rot47(s); return improvesText(out,s) ? {name:'ROT47', out} : null; },
    s => { const out = atbash(s); return improvesText(out,s) ? {name:'Atbash', out} : null; },
    s => { let best=null; for(let k=1;k<26;k++){ if(k===13) continue; const out = rot(s,k); if(improvesText(out,s) && (!best || magicScore(out)>best.sc)) best={name:`César (clé ${26-k})`, out, sc:magicScore(out)}; } return best; },
  ],
];

function magicAnalyze(raw){
  let current = raw;
  const steps = [];
  const seen = new Set([raw]);
  for(let it=0; it<12; it++){
    if(KNOWN_FLAG.test(current)) break; // flag trouvé : on s'arrête là
    let found = null;
    for(const tier of TIERS){
      let best = null;
      for(const det of tier){
        let r; try { r = det(current); } catch { r = null; }
        if(!r || typeof r.out!=='string' || r.out===current || !isReadable(r.out) || seen.has(r.out)) continue;
        const sc = magicScore(r.out);
        if(!best || sc > best.sc) best = {name:r.name, out:r.out, sc};
      }
      if(best){ found = best; break; }
    }
    if(!found) break;
    steps.push({type:found.name, input:current, output:found.out});
    seen.add(found.out);
    current = found.out;
  }
  return {steps, current};
}

// Échappe tout le texte et surligne les flags (THM{..}, flag{..}, CTF{..}, picoCTF{..}, MOT{..})
function highlightFlags(str){
  let out = '', last = 0, m; const flags = [];
  ANY_FLAG.lastIndex = 0;
  while((m = ANY_FLAG.exec(str))){
    out += htmlEntEnc(str.slice(last, m.index)) + '<mark class="magic-flag">' + htmlEntEnc(m[0]) + '</mark>';
    flags.push(m[0]); last = m.index + m[0].length;
  }
  return {html: out + htmlEntEnc(str.slice(last)), flags};
}

function renderFinal(current){
  const hl = highlightFlags(current);
  magicResult = current;
  return `
      <div class="magic-final">
        <div class="magic-final-head">
          <div class="magic-final-title">🎯 Résultat humain lisible :</div>
          <button class="btn-copy" id="magicCopyBtn" type="button">⧉ Copier</button>
        </div>
        <div style="font-size: 0.85rem; font-weight: bold; word-break: break-all; white-space: pre-wrap; background: #020617; padding: 8px; border-radius: 6px; border: 1px solid #22c55e;">${hl.html}</div>
        ${hl.flags.length?`<div class="magic-flags">🚩 Flag${hl.flags.length>1?'s':''} détecté${hl.flags.length>1?'s':''} : ${hl.flags.map(f=>'<mark class="magic-flag">'+htmlEntEnc(f)+'</mark>').join(' ')}</div>`:''}
      </div>`;
}

magicInput.addEventListener('input', () => {
  magicCount.textContent = Array.from(magicInput.value).length + ' car.';
  const raw = magicInput.value.trim();
  if (!raw) { resetMagic(); return; }

  const {steps, current} = magicAnalyze(raw);

  if (steps.length > 0) {
    magicZone.classList.add('magic-success');
    let html = `<div style="margin-bottom: 10px; font-weight: bold; color: #4ade80;">✓ Chemin de décodage trouvé (${steps.length} étape${steps.length > 1 ? 's' : ''}) :</div>`;
    steps.forEach((step, idx) => {
      const cleanInput = step.input.length > 60 ? step.input.substring(0, 57) + '...' : step.input;
      const cleanOutput = step.output.length > 60 ? step.output.substring(0, 57) + '...' : step.output;
      html += `
        <div class="magic-step">
          <span>Étape ${idx + 1} :</span> Détecté comme <strong>${htmlEntEnc(step.type)}</strong><br>
          <small style="color: #64748b;">Entrée : ${htmlEntEnc(cleanInput)}</small><br>
          <small style="color: #a1a1aa;">Sortie : ${htmlEntEnc(cleanOutput)}</small>
        </div>`;
    });
    magicOutput.innerHTML = html + renderFinal(current);

    // Remplissage automatique de la grille principale avec le résultat texte final déduit
    if (fields['text']) {
      fields['text'].value = current;
      updateAll('text');
    }
  } else if (hasAnyFlag(raw)) {
    magicZone.classList.add('magic-success');
    magicOutput.innerHTML = '<div style="margin-bottom: 10px; font-weight: bold; color: #4ade80;">✓ Aucun décodage nécessaire.</div>' + renderFinal(raw);
  } else {
    magicResult = '';
    magicZone.classList.remove('magic-success');
    magicOutput.innerHTML = '<span style="color:#ef4444; font-style:italic;">Aucun encodage standard connu détecté automatiquement (ou texte non imprimable).</span>';
  }
});

magicOutput.addEventListener('click', e => {
  const btn = e.target.closest('#magicCopyBtn');
  if(!btn || !magicResult) return;
  const done = () => { btn.classList.add('copied'); btn.textContent='✓ Copié!'; setTimeout(()=>{btn.classList.remove('copied');btn.textContent='⧉ Copier';},1200); };
  const fallback = () => { const t=document.createElement('textarea'); t.value=magicResult; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch{} t.remove(); done(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(magicResult).then(done, fallback); else fallback();
});
</script>
